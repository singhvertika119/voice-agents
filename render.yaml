# Render blueprint for the background worker (document reader, test worker, cleanup).
# Standard plan: always on, so no keep-awake pinger is needed (an uptime monitor on /healthz is still useful for alerts).
# Secrets are entered in Render's dashboard, never in this file.
services:
  - type: web
    name: voice-background
    runtime: docker
    dockerfilePath: ./deploy/background.Dockerfile
    dockerContext: .
    plan: standard             # 2 GB: room for the test worker (D-104); free/starter (512 MB) cannot run tests
    region: singapore          # the closest Render region to India
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_ROLE_KEY, sync: false}
      - {key: GROQ_API_KEY, sync: false}
      - {key: GEMINI_API_KEY, sync: false}
      - {key: TOOL_SECRET_KEY, sync: false}
      - {key: RUN_TEST_WORKER, value: "1"}   # test conversations from the dashboard run here (peak ~0.6 GB measured)
      - {key: EVAL_CONCURRENCY, value: "3"}   # three conversations at a time (D-108)
      - {key: NIGHTLY_TESTS, value: "weekly"} # on | weekly | off: re-test live agents with calls that week, Sunday 2 am IST (D-125)

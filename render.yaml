# Render blueprint for the background worker (document reader, test worker, cleanup).
# Free web services sleep after 15 minutes without web traffic, so a free uptime monitor must call /healthz every
# 5 minutes (see docs/deployment.md). Secrets are entered in Render's dashboard, never in this file.
services:
  - type: web
    name: voice-background
    runtime: docker
    dockerfilePath: ./deploy/background.Dockerfile
    dockerContext: .
    plan: free
    region: singapore          # the closest Render region to India
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_ROLE_KEY, sync: false}
      - {key: SUPABASE_ANON_KEY, sync: false}
      - {key: OPENAI_API_KEY, sync: false}
      - {key: GROQ_API_KEY, sync: false}
      - {key: GEMINI_API_KEY, sync: false}
      - {key: TOOL_SECRET_KEY, sync: false}
